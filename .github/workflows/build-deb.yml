name: Linux .deb

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  deb:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # attach the .deb to releases on tag pushes
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential \
            pkg-config libssl-dev libxdo-dev libayatana-appindicator3-dev \
            librsvg2-dev

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable (2026-09-23)

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: Linux/src-tauri

      - name: Build .deb
        run: ./Linux/build-deb.sh

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: BeamerPresenter-deb
          path: Linux/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

      - name: Read app version
        id: appver
        run: |
          echo "version=$(sed -n 's/^version = "\(.*\)"/\1/p' Linux/src-tauri/Cargo.toml | head -1)" >> "$GITHUB_OUTPUT"

      # Every push to main publishes/updates the release for the current app
      # version, with the .deb attached — so the download always sits on the
      # repo's Releases page, no local toolchain needed.
      - name: Publish release with .deb
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v${{ steps.appver.outputs.version }}
          name: BeamerPresenter ${{ steps.appver.outputs.version }}
          files: Linux/src-tauri/target/release/bundle/deb/*.deb
